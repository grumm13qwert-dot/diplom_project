{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-4">

        <h3 class="mb-3">Регистрация</h3>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

            <form method="post">
                {% csrf_token %}

                <input type="text" name="username" class="form-control mb-2" placeholder="Username" required>

                <input type="email" name="email" class="form-control mb-2" placeholder="Email (необязательно)">

                <input type="text" name="phone" class="form-control mb-2" placeholder="Телефон">

                <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>

                <button class="btn btn-success w-100">Зарегистрироваться</button>
            </form>

    </div>
</div>

{% endblock %}
