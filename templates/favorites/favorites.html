{% extends 'base.html' %}

{% block content %}

<h2>❤️ Избранные товары</h2>

{% if favorites %}

<div class="row">

    {% for fav in favorites %}
        <div class="col-md-3 mb-4">

            <div class="card h-100 shadow-sm">

                {% if fav.product.image %}
                    <img src="{{ fav.product.image.url }}" class="card-img-top" style="height:200px; object-fit:cover;">
                {% endif %}

                <div class="card-body text-center">

                    <h5>{{ fav.product.name }}</h5>
                    <p class="text-muted">{{ fav.product.price }} сум</p>

                    <a href="/favorites/remove/{{ fav.id }}/" class="btn btn-danger btn-sm">
                        Удалить
                    </a>

                </div>

            </div>

        </div>
    {% endfor %}

</div>

{% else %}
    <p>Нет избранных товаров ❤️</p>
{% endif %}

{% endblock %}
