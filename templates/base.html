{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}MyShop{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- 🔝 Навбар -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <!-- Логотип -->
        <a class="navbar-brand" href="/">
            <img src="{% static 'images/logo.png' %}"
         alt="Logo"
         width="100"
         height="45"
         class="me-2">
            🛒 MyShop</a>

        <!-- Кнопка для мобильных -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- 🔎 Поиск -->
            <form class="d-flex ms-auto me-3" method="get" action="/products/">
                <input class="form-control me-2" type="search" name="q" placeholder="Поиск товаров...">
                <button class="btn btn-outline-light" type="submit">Поиск</button>
            </form>

            <!-- 👤 Кнопки -->
            <div>
                {% if user.is_authenticated %}
                    <a href="/cart/" class="btn btn-outline-light btn-sm me-2">
                    🛒 Моя корзина
                    </a>

                    <span class="text-white me-2">
                    Привет, {{ user.username }}
                    </span>

                    <a href="/users/logout/" class="btn btn-outline-light btn-sm">
                    Выйти
                    </a>
                    <a href="/favorites/" class="btn btn-outline-light btn-sm me-2">
                    ❤️ Избранное
                    </a>
                {% else %}
                    <a href="/users/login/" class="btn btn-outline-light btn-sm me-2">Войти</a>
                    <a href="/users/register/" class="btn btn-warning btn-sm">Регистрация</a>
                {% endif %}
            </div>

        </div>
    </div>
</nav>

<!-- 📦 Контент -->
<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
